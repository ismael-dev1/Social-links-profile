<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | Social links profile</title>
</head>

<body>
  <main class="main-content">
    <article class="social-links-card">
      <div class="profile-picture">
        <img src="./assets/images/avatar-jessica.jpeg"
          alt="photo of a black woman with afro hair wearing a black shirt and looking at the camera">
      </div>

      <div class="name-location">
        <h1 class="name">Jessica Randall</h1>
        <p class="location">London, United Kingdom</p>
      </div>

      <p class="bio">"Front-end developer and avid reader."</p>

      <div class="links-container">
        <a href="https://github.com/">GitHub</a>
        <a href="https://www.frontendmentor.io/home">Frontend Mentor</a>
        <a href="https://www.linkedin.com/">LinkedIn</a>
        <a href="https://x.com/">Twitter</a>
        <a href="https://www.instagram.com/">Instagram</a>
      </div>

    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/ismael-dev1">Ismael</a>.
  </footer>
</body>

</html>
